name: Test integration

on:
  push:
  pull_request:
  workflow_call:
    inputs:
      source_ref:
        type: string
        required: true

permissions:
  contents: read

jobs:
  test:
    runs-on: [self-hosted, linux]
    strategy:
      fail-fast: false
      matrix:
        include:
          - ha: "2026.8.0"
            requirements: requirements-test-min.txt
          - ha: "2026.9.3"
            requirements: requirements-test.txt
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: ${{ matrix.requirements }}
      - name: Install isolated compatibility environment
        env:
          TEST_REQUIREMENTS: ${{ matrix.requirements }}
        run: |
          python -m venv "$RUNNER_TEMP/espcontrol-tests-${{ matrix.ha }}"
          "$RUNNER_TEMP/espcontrol-tests-${{ matrix.ha }}/bin/python" -m pip install -r "$TEST_REQUIREMENTS"
      - name: Verify contract and run compatibility suite
        run: |
          "$RUNNER_TEMP/espcontrol-tests-${{ matrix.ha }}/bin/python" scripts/check_compatibility.py --ha-version "${{ matrix.ha }}"
          "$RUNNER_TEMP/espcontrol-tests-${{ matrix.ha }}/bin/python" -m pytest -q tests/components/espcontrol
